<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01 Introduction To Git</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      color: #eee;
      font-family: "Inter", "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #viewer {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem 1rem 0;
    }

    #viewer img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      display: block;
    }

    #controls {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 0.6rem 1.5rem;
      margin: 0.6rem auto 0.5rem;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      backdrop-filter: blur(6px);
    }

    button {
      background: #e75480;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 0.5rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover  { background: #ff8fbf; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { background: rgba(255,255,255,0.2); cursor: not-allowed; transform: none; }

    #counter {
      font-size: 1rem;
      color: rgba(255,255,255,0.7);
      min-width: 70px;
      text-align: center;
    }

    #progress {
      position: fixed;
      bottom: 0; left: 0;
      height: 3px;
      width: 100%;
      background: rgba(255,255,255,0.1);
    }

    #progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #e75480, #ffb3d1);
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>

  <div id="viewer">
    <img id="slide" src="slide_001.png" alt="Slide 1">
  </div>

  <div id="controls">
    <button id="prev" onclick="go(-1)">&#8592; Previous</button>
    <span id="counter">1 / 6</span>
    <button id="next" onclick="go(1)">Next &#8594;</button>
  </div>

  <div id="progress"><div id="progress-fill"></div></div>

  <script>
    const total = 6;
    let current = 1;

    function pad(n) { return String(n).padStart(3, '0'); }

    function go(dir) {
      const next = current + dir;
      if (next < 1 || next > total) return;
      current = next;
      document.getElementById('slide').src = 'slide_' + pad(current) + '.png';
      document.getElementById('slide').alt = 'Slide ' + current;
      document.getElementById('counter').textContent = current + ' / ' + total;
      document.getElementById('prev').disabled = current === 1;
      document.getElementById('next').disabled = current === total;
      document.getElementById('progress-fill').style.width = (current / total * 100) + '%';
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown')  go(1);
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')    go(-1);
    });

    // Init state
    document.getElementById('prev').disabled = true;
    document.getElementById('progress-fill').style.width = (1 / total * 100) + '%';
  </script>
</body>
</html>
